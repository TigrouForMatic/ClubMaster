server {
    # Redirection HTTP vers HTTPS
    listen 80;
    listen [::]:80;
    server_name clubmaster.fr www.clubmaster.fr;
    return 301 https://$server_name$request_uri;
}

server {
    # Configuration HTTPS
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clubmaster.fr www.clubmaster.fr;

    # Certificats SSL
    ssl_certificate /etc/nginx/ssl/clubmaster.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/clubmaster.fr.key;
    
    # Paramètres SSL recommandés
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS (uncomment if you're sure)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Ajout des logs pour le débogage
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    location / {
        root /usr/share/nginx/html;  # Chemin vers les fichiers buildés de React
        try_files $uri $uri/ /index.html;  # Pour le routing React
    }

    location /api/ {
        # Modifier le proxy_pass pour conserver le chemin /api
        proxy_pass http://api:3200;  # Enlever le / à la fin
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Headers CORS
        add_header 'Access-Control-Allow-Origin' 'https://clubmaster.fr' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;

        # Gestion explicite des requêtes OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://clubmaster.fr' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # À ajouter dans le bloc server HTTPS
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:3200 https://api.clubmaster.fr; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;";

    location /uploads/ {
        alias /chemin/vers/votre/dossier/uploads/;
        try_files $uri $uri/ =404;
    }
}
services:
  api:
    build:
      context: ./API
      dockerfile: DockerfileAPI.Dockerfile
    ports:
      - "3200:3200"
    depends_on:
      - db
    networks:
      - frontend
      - backend
    volumes:
      - ./uploads:/app/uploads:rw
    user: "1000:1000"

  db:
    build:
      context: ./BDD
      dockerfile: DockerfileBDD.Dockerfile
    ports:
      - "5432:5432"
    networks:
      - backend

  web:
    build:
      context: ./APP
      dockerfile: DockerfileAPP.Dockerfile
    ports:
      - "3300:3300"
      - "80:80"
    depends_on:
      - api
    networks:
      - frontend
    volumes:
      - ./uploads:/app/uploads:rw
networks:
  frontend:
  backend:

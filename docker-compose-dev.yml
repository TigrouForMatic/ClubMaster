services:
  api:
    build:
      context: ./API
      dockerfile: DockerfileAPI.Dockerfile
    ports:
      - "3200:3200"
    depends_on:
      - db
      - redis
    networks:
      - frontend
      - backend
    volumes:
      - ./uploads:/app/uploads:rw
    user: "1000:1000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=docker

  db:
    build:
      context: ./BDD
      dockerfile: DockerfileBDD.Dockerfile
    ports:
      - "5432:5432"
    networks:
      - backend

  web:
    build:
      context: ./APP
      dockerfile: DockerfileAPP.Dockerfile
    ports:
      - "3300:3300"
      - "80:80"
    depends_on:
      - api
    networks:
      - frontend
    volumes:
      - ./uploads:/app/uploads:rw

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    command: redis-server --requirepass docker
    environment:
      - REDIS_PASSWORD=docker
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "docker", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:

networks:
  frontend:
  backend:
